name: data-and-agent-governance-and-security-accelerator
metadata:
  template: data-and-agent-governance-and-security-accelerator@1.0
  azd-version: 1.9.0

requiredVersions:
  azd: '>= 1.9.0 != 1.23.9'

infra:
  provider: bicep
  path: infra
  module: main
hooks:
  preprovision:
    - shell: pwsh
      run: |
        Write-Host ""
        Write-Host "  ---------------------------------------------------------------------------------------------------" -ForegroundColor Yellow
        Write-Host "  Note: If deployment fails or you encounter an issue, please open an issue with the deployment logs." -ForegroundColor Yellow
        Write-Host "  https://github.com/microsoft/Data-and-Agent-Governance-and-Security-Accelerator/issues" -ForegroundColor Cyan
        Write-Host "  ---------------------------------------------------------------------------------------------------" -ForegroundColor Yellow
        Write-Host ""
      interactive: true
      continueOnError: false
    - shell: sh
      run: |
        echo ""
        echo "  ---------------------------------------------------------------------------------------------------"
        echo "  Note: If deployment fails or you encounter an issue, please open an issue with the deployment logs."
        echo "  https://github.com/microsoft/Data-and-Agent-Governance-and-Security-Accelerator/issues"
        echo "  ---------------------------------------------------------------------------------------------------"
        echo ""
      interactive: true
      continueOnError: false
    - shell: pwsh
      run: ./hooks/preprovision.ps1
  postprovision:
    shell: pwsh
    run: ./hooks/postprovision.ps1
