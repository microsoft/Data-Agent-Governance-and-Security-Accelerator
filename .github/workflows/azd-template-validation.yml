name: AZD Template Validation
on:
  push:
    branches:
      - psl-pk-azdtemplatevalid
  schedule:
    - cron: '30 1 * * 4' # Every Thursday at 7:00 AM IST (1:30 AM UTC)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  template_validation:
    runs-on: ubuntu-latest
    name: azd template validation
    environment: production
    # Job-level env ensures DAGA vars are in the process environment for all steps and subprocesses.
    env:
      # Skips 'foundation' and 'dspm' — the SP does not have Purview subscription access yet.
      # Restore vars.DAGA_POSTPROVISION_TAGS reference once the SP is granted Purview access.
      DAGA_POSTPROVISION_TAGS: 'defender,foundry'
    steps:
      - uses: actions/checkout@v4

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Export DAGA env vars
        run: echo "DAGA_POSTPROVISION_TAGS=${DAGA_POSTPROVISION_TAGS}" >> $GITHUB_ENV

      - uses: microsoft/template-validation-action@v0.4.3
        id: validation
        with:
          validateAzd: ${{ vars.TEMPLATE_VALIDATE_AZD }}
          validateTests: ${{ vars.TEMPLATE_VALIDATE_TESTS }}
          useDevContainer: ${{ vars.TEMPLATE_USE_DEV_CONTAINER }}
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAGA_PURVIEW_ACCOUNT: ${{ vars.PURVIEW_ACCOUNT_NAME }}
          DAGA_PURVIEW_RESOURCE_GROUP: ${{ vars.PURVIEW_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP }}
          DAGA_PURVIEW_SUBSCRIPTION_ID: ${{ vars.PURVIEW_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}

      - name: print result
        if: always()
        run: cat ${{ steps.validation.outputs.resultFile }}