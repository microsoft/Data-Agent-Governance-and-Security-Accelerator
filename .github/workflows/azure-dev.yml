name: Azure Dev Deploy

on:
  push:
    branches:
      - psl-pk-azdtemplatevalid
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AZURE_DEV_COLLECT_TELEMETRY: ${{ vars.AZURE_DEV_COLLECT_TELEMETRY }}
      DAGA_PURVIEW_ACCOUNT: ${{ vars.PURVIEW_ACCOUNT_NAME }}
      DAGA_PURVIEW_RESOURCE_GROUP: ${{ vars.PURVIEW_RESOURCE_GROUP }}  # Optional
      DAGA_PURVIEW_SUBSCRIPTION_ID: ${{ vars.PURVIEW_SUBSCRIPTION_ID }}  # Optional
      # Skips 'dspm' by default; add it back to DAGA_POSTPROVISION_TAGS once the SP has Purview subscription access.
      DAGA_POSTPROVISION_TAGS: ${{ vars.DAGA_POSTPROVISION_TAGS || 'foundation,defender,foundry' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to AZD
        shell: bash
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      - name: Provision and Deploy
        shell: bash
        run: |
          if ! azd env select "$AZURE_ENV_NAME"; then
            azd env new "$AZURE_ENV_NAME" --subscription "$AZURE_SUBSCRIPTION_ID" --location "$AZURE_LOCATION" --no-prompt
          fi
          azd config set defaults.subscription "$AZURE_SUBSCRIPTION_ID"
          azd up --no-prompt